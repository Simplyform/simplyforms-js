# Release pipeline. Filename kept as publish.yml so the npm Trusted Publisher
# binding (org/repo + workflow filename) does not need to be reconfigured.
#
# Publishing is STAGED: CI never makes a version public on its own. It stages
# the tarball; a maintainer reviews and approves it with 2FA, and only then is
# it installable. See docs/maintainers.md for the approval runbook.
#
# Flow:
#   1. A push to main with a pending changeset -> changesets/action opens (or
#      updates) the "Version Packages" PR. Nothing is staged.
#   2. Merging that PR bumps the version and lands the CHANGELOG on main. The
#      next push has no changesets, so the stage step runs: it stages
#      @simplyforms/sdk to npm with provenance via OIDC Trusted Publishing.
#      Already-published or already-staged versions are skipped, so re-runs are
#      safe. The package is NOT public yet.
#   3. A maintainer reviews (`npm stage list/view`) and approves with 2FA
#      (`npm stage approve <stage-id>`) - off-CI.
#   4. Re-run this workflow (Actions -> Run workflow / workflow_dispatch). Now
#      the version is live on npm, so it creates the v<version> git tag and a
#      GitHub Release with the CycloneDX SBOM attached. Idempotent.
name: Publish Package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # version PR commits, tags, GitHub Releases
      pull-requests: write # open/update the Version Packages PR
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # `npm stage` (staged publishing) needs npm >= 11.15.0, which is newer than
      # the npm bundled with Node 24 (OIDC trusted publishing itself needs
      # >= 11.5.1, also newer than the bundled npm). Pin a known-good version so
      # the stage steps below resolve the command and the OIDC publish works.
      # Bump deliberately.
      - name: Update npm for staged publishing
        run: npm install -g npm@11.17.0

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Run tests
        run: pnpm -r test

      # Opens/updates the "Version Packages" PR when changesets are pending.
      # No `publish-script` input: the actual publish stays on the explicit
      # `npm stage` step below so we control staging + the OIDC/provenance flags.
      # Auth uses the action's `github-token` input default (github.token) --
      # v2 no longer reads the GITHUB_TOKEN env var.
      - name: Create or update the Version Packages PR
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: pnpm changeset version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

      # Stage only after the Version PR has merged (no pending changesets).
      # During the run that merely opens the Version PR, changesets/action has
      # already bumped package.json in the working tree -- staging here would
      # stage that version before the Version PR is merged.
      #
      # @simplyforms/sdk has no workspace dependencies, so `npm stage publish`
      # stages the package directory as-is (no `workspace:*` rewrite, no pack).
      - name: Stage @simplyforms/sdk
        if: steps.changesets.outputs['has-changesets'] == 'false'
        working-directory: packages/sdk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@simplyforms/sdk@$VERSION" version > /dev/null 2>&1; then
            echo "@simplyforms/sdk@$VERSION already published, skipping."
          elif npm stage list "@simplyforms/sdk" --json 2>/dev/null | grep -q "\"$VERSION\""; then
            echo "@simplyforms/sdk@$VERSION already staged, skipping."
          else
            npm stage publish --provenance --access public
          fi

      # Only fires once a version is actually live on npm -- i.e. AFTER a
      # maintainer has approved the staged package (2FA). It is skipped on the
      # staging run (the version isn't public yet) and runs on the post-approval
      # workflow_dispatch re-run: tags v<version> and cuts a GitHub Release with a
      # CycloneDX SBOM attached. Idempotent -- the tag-existence check makes
      # re-runs no-ops.
      - name: Tag and release with SBOM
        if: steps.changesets.outputs['has-changesets'] == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Runs at repo root, so reads the published package (packages/sdk),
          # not the private root @simplyforms/monorepo manifest.
          VERSION=$(node -p "require('./packages/sdk/package.json').version")
          if git rev-parse "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION already tagged; nothing to release."
            exit 0
          fi
          if ! npm view "@simplyforms/sdk@$VERSION" version > /dev/null 2>&1; then
            echo "@simplyforms/sdk@$VERSION is not on npm (not approved yet this run); skipping release."
            exit 0
          fi
          pnpm dlx @cyclonedx/cdxgen@^11 -t pnpm -r -o sbom.cdx.json \
            || echo "SBOM generation failed; continuing without it."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          NOTES="Published \`@simplyforms/sdk@$VERSION\` to npm with provenance. See packages/sdk/CHANGELOG.md for details."
          if [ -f sbom.cdx.json ]; then
            gh release create "v$VERSION" --title "v$VERSION" --notes "$NOTES" sbom.cdx.json
          else
            gh release create "v$VERSION" --title "v$VERSION" --notes "$NOTES"
          fi
